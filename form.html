{% extends "base.html" %}

{% block content %}

  <h1>Create Order</h1>
  <form action="{{ url_for('order_routes.create_order_route') }}" method="post">
    <label for="order_date">Order Date:</label>
    <input type="date" id="order_date" name="order_date"><br><br>
    <label for="inventory_id">Inventory ID:</label>
    <input type="number" id="inventory_id" name="inventory_id"><br><br>
    <label for="quantity">Quantity:</label>
    <input type="number" id="quantity" name="quantity"><br><br>
    <label for="total_cost">Total Cost:</label>
    <input type="number" id="total_cost" name="total_cost"><br><br>
    <button type="submit">Create Order</button>
  </form>

{% endblock %}
